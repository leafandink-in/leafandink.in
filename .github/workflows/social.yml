name: Social kit

on:
  push:
    branches: [main]
    paths: ["_posts/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install pillow

      - name: Make image, Short and captions
        run: python tools/social.py

      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: social-kit
          path: social/
          retention-days: 30
