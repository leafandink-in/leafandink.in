<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if page.layout == "issue" %}{% assign d = page %}{% elsif page.url == "/" %}{% assign d = site.posts.first %}{% endif %}
<title>{% if d %}{{ d.title }} · Leaf &amp; Ink, {{ d.issue }}{% else %}{{ page.title }} · Leaf &amp; Ink{% endif %}</title>
<meta name="description" content="{% if d %}{{ d.standfirst | strip_html }}{% else %}One story at a time.{% endif %}">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#fff;
  --ink:#000;
  --quiet:#777;
  --hair:#ddd;
  --wordmark:#23252B;
  --accent:#344ED8;
  --side:clamp(1.5rem,6vw,4rem);
  --measure:38rem;
  --wrap:76rem;
  --rail:19rem;      /* width of the fixed left column */
  --gap:3.5rem;      /* space between left column and story */
  --hdr:7.5rem;      /* real value set by script */
  --bar:2.4rem;      /* reading bar height */
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Literata",Georgia,serif;
  font-weight:400;
  font-size:1.125rem;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}

a{color:inherit;text-decoration:none}
a:focus-visible,input:focus-visible,button:focus-visible{
  outline:1px solid var(--ink);outline-offset:3px;
}

/* ---------- masthead: stays at the top ---------- */

.masthead{
  position:sticky;top:0;z-index:20;
  background:var(--paper);
  border-bottom:1px solid var(--ink);
  padding:2.1rem var(--side) .6rem;
  text-align:center;
}
.masthead .top{
  position:absolute;top:1.15rem;right:var(--side);
  font-size:.9375rem;font-style:italic;
}
.masthead .top a{
  margin-left:1.3rem;
  border-bottom:1px solid transparent;padding-bottom:1px;
}
.masthead .top a:hover{border-bottom-color:var(--ink)}
.masthead .name{
  font-family:"Figtree","Helvetica Neue",Arial,sans-serif;
  font-weight:800;
  font-size:clamp(1.6rem,4vw,2.1rem);
  letter-spacing:-.02em;
  color:var(--wordmark);
  line-height:1;
  margin:0;
}
.masthead .name .amp{color:var(--accent)}
.masthead .issue{
  font-size:.9375rem;
  font-style:italic;
  margin:.6rem 0 .7rem;
}
.masthead .progress{
  position:absolute;left:0;bottom:-1px;
  height:2px;width:0;background:var(--accent);
}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media (max-width:30rem){
  .masthead{padding-top:1rem}
  .masthead .top{position:static;display:block;text-align:right;margin-bottom:.4rem}
  .masthead .top a:first-child{margin-left:0}
  .masthead .issue{margin:.4rem 0 .5rem}
}

/* ---------- issue page: left column + story ---------- */

.spread{
  max-width:var(--wrap);
  margin:0 auto;
  padding:2.4rem var(--side) 0;
}

.head h1{
  font-family:"Literata",Georgia,serif;
  font-weight:600;
  font-size:clamp(1.9rem,5vw,2.4rem);
  line-height:1.05;
  letter-spacing:-.012em;
  margin:0;
}
.head .standfirst{
  font-style:italic;
  font-size:1.0625rem;
  line-height:1.4;
  margin:.55rem 0 0;
}
.head .kicker{
  font-size:.9375rem;
  font-style:italic;
  margin:.45rem 0 0;
}

figure{margin:1.4rem 0 0;padding:0}
figure img{
  display:block;height:auto;width:auto;
  max-width:100%;max-height:40vh;
  margin:0 auto;
}

/* ---------- story ---------- */

.story{
  max-width:var(--measure);
  margin:1.8rem 0 0;
}
.story p{margin:0 0 1.2em}
.story > p:first-of-type::first-letter{
  font-family:"Literata",Georgia,serif;
  font-size:2.9em;
  line-height:.85;
  float:left;
  padding:.05em .1em 0 0;
  font-weight:600;
}
.story .said{margin-bottom:.8em}

.end{border:0;height:0;margin:3.2rem 0 0}
.end:after{
  content:"";display:inline-block;
  width:.6rem;height:.6rem;background:var(--ink);
}

/* laptops: the left column is pinned and never moves */
@media (min-width:60rem){
  .spread{padding-left:calc(var(--side) + var(--rail) + var(--gap))}
  .side{
    position:fixed;
    top:calc(var(--hdr) + 2.4rem);
    left:calc(max(0px,(100vw - var(--wrap)) / 2) + var(--side));
    width:var(--rail);
    max-height:calc(100vh - var(--hdr) - var(--bar) - 4.4rem);
    overflow:hidden;
    padding-right:var(--gap);
    border-right:1px solid var(--ink);
    text-align:right;
  }
  .side figure img{
    margin:0 0 0 auto;
    max-height:calc(100vh - var(--hdr) - var(--bar) - 19rem);
  }
  .story{margin-top:0}
}

/* ---------- subscribe, once, after the story ---------- */

.foot{
  scroll-margin-top:calc(var(--hdr) + 1rem);
  max-width:var(--measure);
  margin:3.5rem auto 0;
  padding:1.4rem var(--side) 6rem;
  border-top:1px solid var(--hair);
}
.main .foot{margin:3.5rem 0 0;padding:1.4rem 0 6rem}
.foot p{margin:0 0 .2rem;font-size:1rem}
.foot p.italic{font-style:italic}
.foot p.also{margin-top:1.2rem;font-size:.9rem}
.foot p.also a{border-bottom:1px solid #bbb;padding-bottom:1px}

form{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem}
input,button{
  font:inherit;font-size:1rem;
  background:transparent;color:var(--ink);
  border:0;border-bottom:1px solid var(--ink);
  padding:.4rem .1rem;border-radius:0;
}
input{width:14rem;max-width:100%}
input::placeholder{color:var(--ink);opacity:.4}
button{cursor:pointer;font-style:italic}

/* ---------- reading bar: stays at the bottom ---------- */

.readbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  height:var(--bar);
  display:flex;justify-content:space-between;align-items:center;gap:1rem;
  padding:0 var(--side);
  font-size:.8rem;font-style:italic;color:var(--quiet);
  background:rgba(255,255,255,.94);
  border-top:1px solid #eee;
}
.readbar a{border-bottom:1px solid #ccc}
.spread{padding-bottom:var(--bar)}
@media (max-width:36rem){
  body{font-size:1.0625rem}
  .readbar .t{display:none}
}
</style>
</head>
<body>

{{ content }}

<script>
(function(){
  var root=document.documentElement,
      hdr=document.querySelector('.masthead'),
      bar=document.querySelector('.masthead .progress'),
      rb=document.querySelector('.readbar'),
      left=rb&&rb.querySelector('.left'),
      mins=rb?parseInt(rb.getAttribute('data-minutes'),10)||0:0;
  function size(){if(hdr)root.style.setProperty('--hdr',hdr.offsetHeight+'px')}
  function tick(){
    var max=root.scrollHeight-innerHeight,p=max>0?Math.min(1,scrollY/max):0;
    if(bar)bar.style.width=(p*100)+'%';
    if(left&&mins){var r=Math.ceil(mins*(1-p));left.textContent=r>0?r+' min left':'The end';}
  }
  addEventListener('resize',function(){size();tick()});
  addEventListener('scroll',tick,{passive:true});
  size();tick();
})();
</script>
</body>
</html>
