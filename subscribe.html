<section class="foot" id="subscribe">
  <p>Leaf &amp; Ink publishes one story a week.</p>
  <p class="italic">Get each new story by email, every Sunday. Nothing else, ever.</p>
  <p class="also"><a href="{{ "/archive/" | relative_url }}">Read the earlier issues</a></p>
  <form action="#" method="post">
    <label for="email" hidden>Email address</label>
    <input id="email" name="email" type="email" placeholder="your email address" required>
    <button type="submit">Subscribe</button>
  </form>
</section>
